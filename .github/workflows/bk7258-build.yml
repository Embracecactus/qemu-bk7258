# SPDX-License-Identifier: GPL-2.0-or-later
name: BK7258 native build
on:
  push:
    branches: [master]
    paths:
      - 'hw/arm/bk7258*.c'
      - 'hw/adc/bk7258_saradc.c'
      - 'hw/adc/meson.build'
      - 'include/hw/adc/bk7258_saradc.h'
      - 'hw/char/bk7258_uart.c'
      - 'hw/i2c/bk7258_i2c.c'
      - 'hw/ssi/bk7258_spi.c'
      - 'hw/dma/bk7258_dma.c'
      - 'hw/dma/meson.build'
      - 'include/hw/dma/bk7258_dma.h'
      - 'hw/ssi/meson.build'
      - 'include/hw/ssi/bk7258_spi.h'
      - 'hw/i2c/meson.build'
      - 'include/hw/i2c/bk7258_i2c.h'
      - 'hw/block/bk7258_*.c'
      - 'hw/block/meson.build'
      - 'hw/misc/bk7258_*.c'
      - 'hw/watchdog/bk7258_wdt.c'
      - 'hw/timer/armv7m_systick.c'
      - 'hw/timer/bk7258_*.c'
      - 'hw/timer/meson.build'
      - 'accel/tcg/translator.c'
      - 'include/hw/block/bk7258_*.h'
      - 'include/hw/misc/bk7258_*.h'
      - 'include/hw/watchdog/bk7258_wdt.h'
      - 'include/hw/timer/bk7258_*.h'
      - 'include/hw/arm/bk7258.h'
      - 'include/hw/char/bk7258_uart.h'
      - 'hw/arm/Kconfig'
      - 'hw/arm/meson.build'
      - 'hw/char/meson.build'
      - 'tests/unit/test-bk7258-clock.c'
      - 'tests/unit/meson.build'
      - 'tests/qtest/bk7258-test.*'
      - 'tests/qtest/meson.build'
      - 'tests/functional/arm/test_bk7258.py'
      - 'tests/functional/arm/guest-src/bk7258/**'
      - 'tests/functional/arm/meson.build'
      - '.github/workflows/bk7258-build.yml'
      - 'docs/system/arm/bk7258.rst'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc g++ make \
            libglib2.0-dev ninja-build pkg-config python3-venv python3-pip \
            gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Build native arm emulator
        run: |
          mkdir build-bk7258
          cd build-bk7258
          ../configure --target-list=arm-softmmu --without-default-features \
            --disable-docs --disable-user --disable-tools --disable-rust \
            --enable-tcg --enable-werror --enable-tests
          ninja -j2 qemu-system-arm tests/qtest/bk7258-test \
            tests/unit/test-bk7258-clock
      - name: Check three machine registrations
        run: |
          build-bk7258/qemu-system-arm -M help | tee machines.txt
          for machine in t5_board t5ai_core aidk_ai_toy; do
            grep -E "^${machine}[[:space:]]" machines.txt
          done
      - name: Check bounded clock accounting
        run: |
          cd build-bk7258
          ./pyvenv/bin/meson test --no-rebuild --print-errorlogs \
            --logbase bk7258-clock-unit test-bk7258-clock
      - name: Run independent BK7258 hardware qtests
        run: |
          cd build-bk7258
          ./pyvenv/bin/meson test --no-rebuild --print-errorlogs qtest-arm/bk7258-test
      - name: Execute source-built three-core fixtures
        env:
          QEMU_TEST_KEEP_SCRATCH: '1'
        run: |
          cd build-bk7258
          command -v arm-none-eabi-gcc
          ./pyvenv/bin/meson test --setup thorough --print-errorlogs func-arm-bk7258
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bk7258-tests-${{ github.sha }}
          path: |
            build-bk7258/meson-logs/bk7258-clock-unit*
            build-bk7258/meson-logs/testlog*
            build-bk7258/tests/functional/arm/test_bk7258.*
