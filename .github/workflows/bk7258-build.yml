# SPDX-License-Identifier: GPL-2.0-or-later
name: BK7258 native build
on:
  push:
    branches: [master]
    paths:
      - 'hw/arm/bk7258.c'
      - 'hw/char/bk7258_uart.c'
      - 'hw/block/bk7258_*.c'
      - 'hw/block/meson.build'
      - 'hw/misc/bk7258_*.c'
      - 'hw/watchdog/bk7258_wdt.c'
      - 'hw/timer/armv7m_systick.c'
      - 'accel/tcg/translator.c'
      - 'include/hw/block/bk7258_*.h'
      - 'include/hw/misc/bk7258_*.h'
      - 'include/hw/watchdog/bk7258_wdt.h'
      - 'include/hw/arm/bk7258.h'
      - 'include/hw/char/bk7258_uart.h'
      - 'hw/arm/Kconfig'
      - 'hw/arm/meson.build'
      - 'hw/char/meson.build'
      - '.github/workflows/bk7258-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc g++ make \
            libglib2.0-dev ninja-build pkg-config python3-venv python3-pip
      - name: Build native arm emulator
        run: |
          mkdir build-bk7258
          cd build-bk7258
          ../configure --target-list=arm-softmmu --without-default-features \
            --disable-docs --disable-user --disable-tools --disable-rust \
            --enable-tcg --enable-werror
          ninja -j2 qemu-system-arm
      - name: Check three machine registrations
        run: |
          build-bk7258/qemu-system-arm -M help | tee machines.txt
          for machine in t5_board t5ai_core aidk_ai_toy; do
            grep -E "^${machine}[[:space:]]" machines.txt
          done
