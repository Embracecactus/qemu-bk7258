# SPDX-License-Identifier: GPL-2.0-or-later
name: BK7258 native build
on:
  push:
    branches: [master, fix/bk7258-core-reset-vector, feat/bk7258-sys-v1]
    # Shared QEMU headers, clocks, ptimer, trace generators and build inputs
    # all affect this target. Run every change on these explicit branches;
    # a device-only paths allowlist silently misses transitive dependencies.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc g++ make \
            libglib2.0-dev ninja-build pkg-config python3-venv python3-pip \
            gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Build native arm emulator
        run: |
          mkdir build-bk7258
          cd build-bk7258
          ../configure --target-list=arm-softmmu --without-default-features \
            --disable-docs --disable-user --disable-tools --disable-rust \
            --enable-tcg --enable-werror --enable-tests
          ninja -j2 qemu-system-arm tests/qtest/bk7258-test \
            tests/unit/test-bk7258-clock tests/unit/ptimer-test \
            tests/qtest/cmsdk-apb-timer-test tests/unit/test-i2c-readdress \
            tests/qtest/npcm7xx_smbus-test
      - name: Check three machine registrations
        run: |
          build-bk7258/qemu-system-arm -M help | tee machines.txt
          for machine in t5_board t5ai_core aidk_ai_toy; do
            grep -E "^${machine}[[:space:]]" machines.txt
          done
      - name: Check bounded clock accounting
        run: |
          cd build-bk7258
          ./pyvenv/bin/meson test --no-rebuild --print-errorlogs \
            --logbase bk7258-clock-unit test-bk7258-clock
      - name: Check shared ptimer and non-BK timer consumer
        run: |
          cd build-bk7258
          ./pyvenv/bin/meson test --no-rebuild --print-errorlogs \
            --logbase shared-timer ptimer-test qtest-arm/cmsdk-apb-timer-test
      - name: Check shared I2C core, SMBus, mux and non-BK controllers
        run: |
          cd build-bk7258
          ./pyvenv/bin/meson test --no-rebuild --print-errorlogs \
            --logbase shared-i2c test-i2c-readdress \
            qtest-arm/npcm7xx_smbus-test
      - name: Run independent BK7258 hardware qtests
        run: |
          cd build-bk7258
          ./pyvenv/bin/meson test --no-rebuild --print-errorlogs qtest-arm/bk7258-test
      - name: Check QSPI long-frame pause and cancellation events
        run: |
          REAL_QEMU=$PWD/build-bk7258/qemu-system-arm \
          QSPI_TRACE=$PWD/build-bk7258/meson-logs/qspi-page-cancel-trace.log \
          QTEST_QEMU_BINARY=$PWD/docs/system/arm/bk7258-qspi-v5-evidence/trace-qemu-system-arm \
            build-bk7258/tests/qtest/bk7258-test \
            -p /arm/bk7258/t5_board/qspi-page-pause-cancel
          MESON_BUILD_ROOT=$PWD/build-bk7258 \
            build-bk7258/pyvenv/bin/python3 \
            docs/system/arm/bk7258-qspi-v5-evidence/verify-cancel.py \
            build-bk7258/meson-logs/qspi-page-cancel-trace.log \
            build-bk7258/meson-logs/qspi-page-cancel-frames.json
      - name: Execute source-built three-core fixtures
        env:
          QEMU_TEST_KEEP_SCRATCH: '1'
        run: |
          cd build-bk7258
          command -v arm-none-eabi-gcc
          ./pyvenv/bin/meson test --setup thorough --print-errorlogs func-arm-bk7258
      - name: Verify QSPI V5 incremental evidence
        run: |
          cd docs/system/arm/bk7258-qspi-v5-evidence
          sha256sum --check SHA256SUMS
      - name: Verify QSPI V4 comparison evidence
        run: |
          cd docs/system/arm/bk7258-qspi-v4-evidence
          sha256sum --check SHA256SUMS
      - name: Verify I2C V3 comparison evidence
        run: |
          cd docs/system/arm/bk7258-i2c-v3-evidence
          sha256sum --check SHA256SUMS
      - name: Verify entry investigation evidence
        run: |
          python3 -m py_compile scripts/bk7258-product-probe.py
          cd docs/system/arm/bk7258-entry-v2-evidence
          sha256sum --check SHA256SUMS
      - name: Remove unrelated host environment from published test logs
        if: always()
        run: python3 scripts/bk7258-scrub-test-logs.py build-bk7258/meson-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bk7258-tests-${{ github.sha }}
          path: |
            build-bk7258/meson-logs/bk7258-clock-unit*
            build-bk7258/meson-logs/shared-timer*
            build-bk7258/meson-logs/shared-i2c*
            build-bk7258/meson-logs/qspi-page-cancel*
            build-bk7258/meson-logs/testlog*
            build-bk7258/tests/functional/arm/test_bk7258.*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bk7258-entry-v2-evidence-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            docs/system/arm/bk7258-entry-v2.rst
            docs/system/arm/bk7258-entry-v2-evidence/
            scripts/bk7258-product-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bk7258-i2c-v3-evidence-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            docs/system/arm/bk7258-i2c-v3.rst
            docs/system/arm/bk7258-i2c-v3-evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bk7258-qspi-v4-evidence-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            docs/system/arm/bk7258-qspi-v4.rst
            docs/system/arm/bk7258-qspi-v4-evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bk7258-qspi-v5-evidence-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            docs/system/arm/bk7258-qspi-v5.rst
            docs/system/arm/bk7258-qspi-v5-evidence/
